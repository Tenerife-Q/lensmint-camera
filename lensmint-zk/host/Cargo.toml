[package]
name = "host"
version = "0.1.0"
edition = "2021"

[lib]
name = "host"
path = "src/lib.rs"

[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bincode = "1.3"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
hex = "0.4"
image = "0.24"
image_hasher = "1.2"
lensmint-zk-core = { path = "../core" }
methods = { path = "../methods" }
rand = "0.8"
risc0-zkvm = { version = "=3.0.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
