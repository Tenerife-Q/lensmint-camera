[package]
name = "lensmint-zk-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
thiserror = "2.0"

[dev-dependencies]
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8"
